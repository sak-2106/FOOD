<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#17231d">
<title>FoodLens — Sign in</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- animated background -->
<div class="bg-frame" aria-hidden="true">
  <span class="blob blob-a"></span>
  <span class="blob blob-b"></span>
  <span class="blob blob-c"></span>
  <span class="blob blob-d"></span>
  <div class="produce" id="produceLayer"></div>
</div>

<div class="app">

  <section id="authPage" class="auth-page">
    <div class="auth-card">

      <div class="brand">
        <span class="lens-mark" aria-hidden="true">
          <span class="lens-corner tl"></span>
          <span class="lens-corner tr"></span>
          <span class="lens-corner bl"></span>
          <span class="lens-corner br"></span>
          <span class="lens-dot"></span>
        </span>
        <span class="brand-name">FoodLens</span>
      </div>

      <h1 id="authTitle">Read the label first</h1>
      <p id="authSubtitle">Sign in to scan a package and see what's actually in it.</p>

      <form id="authForm" novalidate>

        <div class="field" id="nameField" hidden>
          <label for="name">Name</label>
          <input type="text" id="name" placeholder="Your name" autocomplete="name">
        </div>

        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="you@example.com" autocomplete="email">
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="At least 6 characters" autocomplete="current-password">
        </div>

        <div class="auth-error" id="authError" role="alert" hidden></div>

        <button type="submit" class="btn-primary" id="authSubmit">
          <span>Continue to FoodLens</span>
        </button>
      </form>

      <p class="auth-switch">
        <span id="switchPrompt">New here?</span>
        <button type="button" id="switchBtn">Create an account</button>
      </p>

    </div>
  </section>

</div>

<script src="common.js"></script>
<script src="login.js"></script>
</body>
</html>
